<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shirinstan · Cashier POS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,800;1,9..40,400&family=DM+Mono:wght@400;500&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --ink: #0D0F14;
    --ink-2: #1A1D27;
    --ink-3: #252836;
    --surface: #F4F5F8;
    --card: #FFFFFF;
    --border: #E8EAF0;
    --muted: #8B90A0;
    --accent: #5B5FEF;
    --accent-2: #7C3FE4;
    --accent-glow: rgba(91,95,239,0.18);
    --green: #10B981;
    --red: #F43F5E;
    --amber: #F59E0B;
    --blue: #3B82F6;
    --sidebar-w: 240px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--surface);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* LAYOUT */
  #appWrap { display: flex; min-height: 100vh; }

  /* SIDEBAR */
  #sidebar {
    width: var(--sidebar-w);
    background: var(--ink-2);
    display: flex;
    flex-direction: column;
    position: fixed;
    inset-y: 0;
    left: 0;
    z-index: 60;
    transition: transform .3s cubic-bezier(.4,0,.2,1);
    overflow-y: auto;
    overflow-x: hidden;
  }
  #sidebar::-webkit-scrollbar { width: 0; }

  .sidebar-logo { display: flex; align-items: center; gap: 12px; padding: 22px 18px 18px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: white; box-shadow: 0 4px 14px rgba(91,95,239,.4); flex-shrink: 0; }
  .logo-text { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 15px; color: white; line-height: 1.2; }
  .logo-sub { font-size: 9px; font-weight: 500; color: rgba(255,255,255,.35); text-transform: uppercase; letter-spacing: .1em; }

  .nav-section { padding: 18px 12px 4px; font-size: 8.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.25); }

  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 14px; margin: 1px 8px; border-radius: 9px; font-size: 13px; font-weight: 500; color: rgba(255,255,255,.5); cursor: pointer; transition: all .18s; border: none; background: transparent; width: calc(100% - 16px); text-align: left; }
  .nav-item i { width: 16px; text-align: center; font-size: 13px; }
  .nav-item:hover { background: rgba(255,255,255,.06); color: rgba(255,255,255,.85); }
  .nav-item.active { background: rgba(91,95,239,.2); color: white; font-weight: 700; }
  .nav-item.active i { color: #818CF8; }

  .nav-badge { margin-left: auto; background: linear-gradient(135deg, #F43F5E, #DC2626); color: white; font-size: 8.5px; font-weight: 800; padding: 2px 7px; border-radius: 10px; min-width: 20px; text-align: center; }

  .sidebar-footer { padding: 14px 12px; border-top: 1px solid rgba(255,255,255,.06); }
  .user-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.05); cursor: pointer; }
  .user-avatar { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: white; flex-shrink: 0; }
  .user-name { font-size: 12px; font-weight: 700; color: white; }
  .user-role { font-size: 9px; color: rgba(255,255,255,.35); }

  /* MAIN */
  #mainContent { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-width: 0; transition: margin .3s cubic-bezier(.4,0,.2,1); }

  /* TOPBAR */
  #topbar { position: sticky; top: 0; z-index: 40; background: rgba(244,245,248,.92); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
  .topbar-left { display: flex; align-items: center; gap: 14px; }
  .menu-btn { width: 36px; height: 36px; border-radius: 8px; background: white; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); transition: all .15s; }
  .menu-btn:hover { color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  #pageTitle { font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 700; color: var(--ink); }
  #pageDate { font-size: 11px; color: var(--muted); }

  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .topbar-btn { display: flex; align-items: center; gap: 7px; padding: 8px 16px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; border: none; border-radius: 9px; font-size: 12.5px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px rgba(91,95,239,.35); transition: all .15s; }
  .topbar-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(91,95,239,.45); }

  /* PAGE WRAPPER */
  #pageWrap { padding: 24px; flex: 1; }

  /* TAB SYSTEM */
  .tab-content { display: none; animation: fadeUp .3s ease-out; }
  .tab-content.active { display: block; }
  @keyframes fadeUp { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }

  /* CARDS */
  .card { background: var(--card); border-radius: 18px; border: 1px solid var(--border); overflow: hidden; }
  .card-pad { padding: 22px; }
  .card-header { padding: 22px 24px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .card-title { font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 800; color: var(--ink); }

  /* FORMS */
  .form-label { display: block; font-size: 12px; font-weight: 700; color: var(--ink); margin-bottom: 7px; }
  .inp { width: 100%; padding: 10px 13px; border: 1px solid var(--border); border-radius: 11px; font-size: 13px; font-family: 'DM Sans', sans-serif; color: var(--ink); background: white; transition: all .15s; box-sizing: border-box; }
  .inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .inp::placeholder { color: var(--muted); }

  /* BUTTONS */
  .btn { padding: 10px 18px; border-radius: 10px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; transition: all .15s; display: inline-flex; align-items: center; gap: 7px; font-family: 'DM Sans', sans-serif; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; box-shadow: 0 4px 14px rgba(91,95,239,.35); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(91,95,239,.45); }
  .btn-secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--border); }
  .btn-danger { background: rgba(244,63,94,.1); color: var(--red); }

  /* LOGIN SCREEN */
  #loginScreen { position: fixed; inset: 0; background: var(--ink-2); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
  #setupScreen { position: fixed; inset: 0; background: var(--ink-2); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .setup-box { background: white; border-radius: 24px; padding: 40px; width: 100%; max-width: 440px; box-shadow: 0 32px 80px rgba(0,0,0,.3); }

  /* TOAST */
  #toast { position: fixed; bottom: 24px; right: 24px; z-index: 999; background: var(--ink-2); color: white; padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.2); display: none; align-items: center; gap: 12px; }
  #toast.show { display: flex; animation: slideIn .3s ease-out; }
  @keyframes slideIn { from { transform: translateX(360px); opacity:0; } to { transform: translateX(0); opacity:1; } }
  #toast.success { background: rgba(16,185,129,.95); }
  #toast.error { background: rgba(244,63,94,.95); }

  @media (max-width: 900px) {
    #sidebar { transform: translateX(-100%); }
    #mainContent { margin-left: 0; }
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="setup-box">
    <div style="text-align:center; margin-bottom:28px;">
      <div class="logo-icon" style="width:52px;height:52px;border-radius:14px;font-size:22px;margin:0 auto 14px;">
        <i class="fas fa-crown"></i>
      </div>
      <h1 style="font-family:'Sora',sans-serif;font-size:22px;font-weight:800;color:var(--ink);margin-bottom:4px;">Shirinstan POS</h1>
      <p style="font-size:12px;color:var(--muted);">Login to access the system</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px;">
      <div>
        <label class="form-label">Email</label>
        <input id="loginEmail" class="inp" type="email" placeholder="kurdishapps0@gmail.com" value="">
      </div>
      <button onclick="handleLogin()" class="btn btn-primary" style="width:100%;justify-content:center;padding:13px;">
        <i class="fas fa-sign-in-alt"></i> Login
      </button>
    </div>
    <p id="loginError" style="text-align:center;font-size:11px;color:var(--red);margin-top:12px;display:none;"></p>
    <p style="text-align:center;font-size:10px;color:var(--muted);margin-top:16px;">Authorized email: kurdishapps0@gmail.com</p>
  </div>
</div>

<!-- APP WRAP -->
<div id="appWrap" style="display:none;">

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><i class="fas fa-crown"></i></div>
      <div>
        <div class="logo-text">Shirinstan</div>
        <div class="logo-sub">Cashier POS</div>
      </div>
    </div>

    <nav style="flex:1;padding:8px 0;">
      <div class="nav-section">Main</div>
      <button class="nav-item active" onclick="switchTab('dashboard')"><i class="fas fa-chart-pie"></i> Dashboard</button>
      <button class="nav-item" onclick="switchTab('pos')"><i class="fas fa-cash-register"></i> POS / Sell</button>
    </nav>

    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar" id="userAvatar">A</div>
        <div style="flex:1;min-width:0;">
          <div class="user-name" id="userName">Admin</div>
          <div class="user-role" id="userEmail" style="font-size:10px;">Cashier Manager</div>
        </div>
        <button onclick="handleLogout()" style="background:none;border:none;color:rgba(255,255,255,.3);cursor:pointer;font-size:13px;" title="Logout"><i class="fas fa-power-off"></i></button>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div id="mainContent">
    <div id="topbar">
      <div class="topbar-left">
        <button class="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        <div>
          <div id="pageTitle">Dashboard</div>
          <div id="pageDate"></div>
        </div>
      </div>
    </div>

    <div id="pageWrap">
      <section id="tab-dashboard" class="tab-content active">
        <div style="text-align:center;padding:40px;">
          <div class="logo-icon" style="width:60px;height:60px;border-radius:16px;font-size:28px;margin:0 auto 20px;">
            <i class="fas fa-chart-line"></i>
          </div>
          <h2 style="font-family:'Sora',sans-serif;font-size:20px;font-weight:800;margin-bottom:8px;">Dashboard</h2>
          <p style="color:var(--muted);">Welcome to Shirinstan POS System</p>
          <p style="color:var(--accent);font-weight:700;margin-top:16px;">✅ Successfully logged in with embedded Supabase API</p>
        </div>
      </section>
    </div>
  </div>

</div>

<!-- TOAST -->
<div id="toast">
  <i class="ti fas fa-check-circle"></i>
  <span id="toastMsg"></span>
</div>

<script>
let sb = null;
let isDemo = false;

// ══════════════════════════════════════════════
// SUPABASE CREDENTIALS (Embedded in HTML)
// ══════════════════════════════════════════════
const SUPABASE_URL = 'https://ipolnufrysjsrakubalzx.supabase.co';
const SUPABASE_ANON_KEY = 'your_new_anon_key_here';
const AUTHORIZED_EMAIL = 'kurdishapps0@gmail.com';

// Auto-initialize on page load
window.addEventListener('load', () => {
  const userEmail = localStorage.getItem('user_email');
  
  if (!userEmail) {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('appWrap').style.display = 'none';
    return;
  }
  
  // User logged in - update display and connect to Supabase
  updateUserDisplay(userEmail);
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appWrap').style.display = 'flex';
  
  // Auto-connect to Supabase
  try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    showToast('✅ Connected to Supabase!', 'success');
  } catch(e) {
    showToast('Connection error: ' + e.message, 'error');
  }
});

// ══════════════════════════════════════════════
// LOGIN SYSTEM
// ══════════════════════════════════════════════
function handleLogin() {
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const errorEl = document.getElementById('loginError');
  
  if (!email) {
    errorEl.textContent = 'Please enter an email';
    errorEl.style.display = 'block';
    return;
  }
  
  if (email !== AUTHORIZED_EMAIL.toLowerCase()) {
    errorEl.textContent = 'Only ' + AUTHORIZED_EMAIL + ' is authorized';
    errorEl.style.display = 'block';
    return;
  }
  
  // Store user info
  localStorage.setItem('user_email', email);
  localStorage.setItem('user_name', 'Admin');
  
  // Update UI
  updateUserDisplay(email);
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appWrap').style.display = 'flex';
  document.getElementById('pageDate').textContent = new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  
  // Auto-connect to Supabase
  try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    showToast('✅ Welcome! Connected to Supabase', 'success');
  } catch(e) {
    showToast('Connection error: ' + e.message, 'error');
  }
}

function handleLogout() {
  if (!confirm('Are you sure you want to logout?')) return;
  localStorage.removeItem('user_email');
  localStorage.removeItem('user_name');
  location.reload();
}

function updateUserDisplay(email) {
  const avatar = email.charAt(0).toUpperCase();
  const name = email.split('@')[0];
  document.getElementById('userAvatar').textContent = avatar;
  document.getElementById('userName').textContent = name;
  document.getElementById('userEmail').textContent = email;
}

function switchTab(id) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('tab-' + id)?.classList.add('active');
  document.querySelector(`.nav-item[onclick*="${id}"]`)?.classList.add('active');
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  const icons = { success:'fa-check-circle', error:'fa-times-circle', warn:'fa-exclamation-circle' };
  t.querySelector('.ti').className = 'fas ' + (icons[type]||icons.success) + ' ti';
  document.getElementById('toastMsg').textContent = msg;
  t.className = 'show ' + type;
  setTimeout(()=>{ t.classList.remove('show'); }, 3000);
}

// Allow Enter key on login
document.addEventListener('DOMContentLoaded', () => {
  const loginEmail = document.getElementById('loginEmail');
  if (loginEmail) {
    loginEmail.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleLogin();
    });
  }
});
</script>

</body>
</html>
